<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>至善小当家 · 至善百味行</title>
  <meta name="description" content="至善百味行互动烹饪小游戏——点击灶台解锁中华风味。">
  <link rel="icon" href="assets/images/decorations/favicon.svg" type="image/svg+xml">

  <!-- 全站样式 -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/game.css">

  <!-- GSAP（含 Draggable 插件，用于食材拖拽）本地化，离线可用 -->
  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/Draggable.min.js" defer></script>
</head>
<body>

  <!-- 顶部导航栏 -->
  <nav class="site-nav" id="site-nav">
    <a class="nav-logo" href="index.html">
      <span class="logo-seal">至</span>
      <span>至善百味行</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">首页</a></li>
      <li><a href="game.html" class="active">至善小当家</a></li>
      <li><a href="about.html">关于</a></li>
    </ul>
  </nav>

  <main class="game-page">

    <!-- 顶部横幅 -->
    <section class="game-banner">
      <img class="game-banner__bg"
           src="assets/images/kitchen/kitchen-banner.webp"
           alt="" aria-hidden="true">
      <div class="game-banner__inner">
        <h1 class="game-banner__title">至善小当家</h1>
        <p class="game-banner__sub">点击灶台 解锁风味</p>
      </div>
    </section>

    <!-- 厨房舞台：完整背景 + 三个器具叠加层 -->
    <section class="kitchen-stage" id="kitchen-stage">

      <!-- 背景图（img标签保证完整展示，无白色缝隙） -->
      <img class="kitchen-stage__bg"
           src="assets/images/kitchen/kitchen-bg.webp"
           alt="" aria-hidden="true">

      <!-- 器具叠加层 -->
      <div class="stations-layer" id="stations-layer">
        <!-- 由 game.js 渲染 -->
      </div>

      <!-- 底部提示 -->
      <div class="game-hint-bar">— 点击灶台，开始烹饪 —</div>

    </section>

    <!-- 左侧食材选择栏（竖排，拼音排序，可搜索） -->
    <aside class="ingredients-panel" id="ingredients-panel">
      <div class="ingredients-panel__head">
        <span class="ingredients-panel__title">食材柜</span>
        <div class="ingredients-panel__tools">
          <button class="ingredients-panel__recipe-btn" id="recipe-btn"
                  type="button" title="查看配方表">📜</button>
          <button class="ingredients-panel__search-btn" id="ingredients-search-btn"
                  type="button" aria-label="搜索食材" title="搜索食材">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 搜索输入框（默认隐藏，点放大镜展开） -->
      <div class="ingredients-panel__searchbox" id="ingredients-searchbox" hidden>
        <input type="text" id="ingredients-search-input"
               placeholder="输入食材名称…" autocomplete="off">
      </div>

      <!-- 食材列表（由 ingredients.js 渲染） -->
      <ul class="ingredients-panel__list" id="ingredients-list"></ul>
    </aside>

  </main>

  <!-- 结果提示浮层 -->
  <div class="drop-hint" id="drop-hint"></div>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="footer-brand">至善百味行</div>
    <p>以互动版图漫游三十四个省级行政区的饮食文化 · 本项目为静态网站，数据驱动呈现</p>
    <p>© 2025 至善百味行 · 版权所有</p>
  </footer>

  <!-- 页面脚本 -->
  <script src="js/utils.js" defer></script>
  <script src="js/cursor.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/ingredients.js" defer></script>
</body>
</html>
